<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ribt in the browser</title>
<style>
  :root { --bg: #fbf8f3; --fg: #1d1a16; --dim: #8a8178; --line: #e6dfd4; --accent: #e8604c; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16130f; --fg: #eee7dc; --dim: #8f877c; --line: #2c2620; --accent: #ff7a63; --card: #1e1a15; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; } h1 b { color: var(--accent); }
  .sub { color: var(--dim); margin: 0 0 20px; font-size: 13px; }
  textarea { width: 100%; min-height: 84px; padding: 12px; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 10px; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; margin: 10px 0 18px; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 18px; border-radius: 999px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  #phones { display: flex; flex-wrap: wrap; gap: 3px; font: 15px/1 ui-monospace, monospace; }
  #phones span { padding: 5px 4px; border-radius: 4px; background: var(--bg); min-width: 1.3em; text-align: center; transition: background .05s; }
  #phones span.on { background: var(--accent); color: #fff; }
  #phones span small { display: block; font-size: 9px; color: var(--dim); margin-top: 3px; }
  #phones span.on small { color: #fff; }
  canvas { width: 100%; display: block; border-radius: 6px; }
  #times { font: 12px ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1><b>ribt</b>, running in this tab</h1>
  <p class="sub">lilt G2P (wasm) → acoustic → 1-step flow → Vocos vocoder, all on WebGPU. Voice distilled from Kokoro af_heart.</p>
  <textarea id="text">Hello! I am RIBT, a small voice that runs right in your browser. Type anything, and I will say it.</textarea>
  <div class="row"><button id="go" disabled>Loading…</button><span id="status"></span></div>
  <section><h2>Phonemes · durations</h2><div id="phones"></div></section>
  <section><h2>Pitch (F0, Hz)</h2><canvas id="f0" height="110"></canvas></section>
  <section><h2>Mel spectrogram (after flow)</h2><canvas id="mel" height="160"></canvas></section>
  <section><h2>Timing</h2><div id="times"></div></section>
</main>
<script type="module">
import { RIBT } from "./ribt.js";
const $ = (id) => document.getElementById(id);
const status = (s) => ($("status").textContent = s);
let tts, ctx, playing = false;

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function drawF0(c, f0, cursor = -1) {
  const w = (c.width = c.clientWidth * devicePixelRatio), h = (c.height = 110 * devicePixelRatio), g = c.getContext("2d");
  g.clearRect(0, 0, w, h);
  const lo = 80, hi = 400, y = (v) => h - ((Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))) * h;
  g.strokeStyle = css("--accent"); g.lineWidth = 2 * devicePixelRatio; g.beginPath();
  let up = false;
  f0.forEach((v, i) => { const x = (i / f0.length) * w; if (v > 0) { up ? g.lineTo(x, y(v)) : g.moveTo(x, y(v)); up = true; } else up = false; });
  g.stroke();
  if (cursor >= 0) { g.fillStyle = css("--dim"); g.fillRect((cursor / f0.length) * w, 0, devicePixelRatio, h); }
}

function drawMel(c, mel, C, F) {
  const g = c.getContext("2d");
  c.width = F; c.height = C;
  const img = g.createImageData(F, C);
  let lo = Infinity, hi = -Infinity;
  for (const v of mel) { if (v < lo) lo = v; if (v > hi) hi = v; }
  lo = Math.max(lo, hi - 9);
  for (let ch = 0; ch < C; ch++) for (let f = 0; f < F; f++) {
    const v = Math.min(1, Math.max(0, (mel[ch * F + f] - lo) / (hi - lo)));
    const o = ((C - 1 - ch) * F + f) * 4;
    img.data[o] = 20 + 230 * v; img.data[o + 1] = 16 + 90 * v * v; img.data[o + 2] = 30 + 50 * v; img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  c.style.height = "160px"; c.style.imageRendering = "pixelated";
}

function showPhones(tokens, durs) {
  $("phones").innerHTML = tokens.map((t, i) => (t.ph ? `<span data-i="${i}">${t.ph === " " ? "·" : t.ph}${durs ? `<small>${durs[i]}</small>` : ""}</span>` : "")).join("");
}

async function play(r) {
  ctx ??= new AudioContext({ sampleRate: r.sr });
  const buf = ctx.createBuffer(1, r.audio.length, r.sr);
  buf.copyToChannel(r.audio, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(ctx.destination);
  const start = ctx.currentTime + 0.02;
  src.start(start);
  // cumulative frame starts per token, for the karaoke highlight
  const starts = []; r.durs.reduce((a, d, i) => ((starts[i] = a), a + d), 0);
  const spans = [...$("phones").querySelectorAll("span")];
  await new Promise((done) => {
    src.onended = done;
    const tick = () => {
      const f = ((ctx.currentTime - start) * r.sr) / r.hop;
      if (f > r.frames) return;
      let k = 0; while (k + 1 < starts.length && starts[k + 1] <= f) k++;
      spans.forEach((s) => s.classList.toggle("on", +s.dataset.i === k));
      drawF0($("f0"), r.f0, f);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
  spans.forEach((s) => s.classList.remove("on"));
}

async function speak() {
  $("go").disabled = true;
  const t0 = performance.now();
  let first = null, lines = [], queue = Promise.resolve();
  try {
    for await (const r of tts.speak($("text").value, {
      onStage: (s, d) => {
        if (playing) return; // a later chunk computing while an earlier one plays
        if (s === "phonemes") showPhones(d.tokens);
        if (s === "durations") status(`${d.frames} frames · ${d.seconds.toFixed(2)} s`);
        if (s === "decoder") drawF0($("f0"), d.f0);
        if (s === "flow") drawMel($("mel"), d.mel, d.nMels, d.frames);
      },
    })) {
      first ??= performance.now() - t0;
      const t = r.timings;
      lines.push(`[n${r.buckets.n} t${r.buckets.t}] g2p ${t.g2p_ms.toFixed(1)}  enc ${t.enc_ms.toFixed(1)}  dec ${t.dec_ms.toFixed(1)}  flow ${t.flow_ms.toFixed(1)}  voc ${t.voc_ms.toFixed(1)}  = ${t.total_ms.toFixed(0)} ms for ${(r.audio.length / r.sr).toFixed(2)} s (RTF ${t.rtf.toFixed(3)})  “${r.text.slice(0, 40)}”`);
      $("times").textContent = `time to first audio ${first.toFixed(0)} ms\n` + lines.join("\n");
      queue = queue.then(async () => { playing = true; showPhones(r.tokens, r.durs); drawMel($("mel"), r.mel, r.nMels, r.frames); await play(r); });
    }
    await queue;
    playing = false;
  } catch (e) { status("error: " + e.message); console.error(e); }
  playing = false;
  $("go").disabled = false;
}

try {
  tts = await RIBT.load({
    onProgress: (p) => {
      if (p.stage === "download") status(`downloading ${(p.got / 1e6).toFixed(0)} / ${(p.total / 1e6).toFixed(0)} MB`);
      if (p.stage === "compile") status("compiling GPU kernels…");
      if (p.stage === "ready") status(`ready in ${(p.ready_ms / 1000).toFixed(1)} s (kernels ${(p.compile_ms / 1000).toFixed(1)} s)`);
    },
  });
  $("go").textContent = "Speak"; $("go").disabled = false;
  $("go").onclick = speak;
  tts.prewarm();
} catch (e) { status("error: " + e.message); console.error(e); }
</script>
</body>
</html>
